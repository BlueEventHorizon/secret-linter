  linter/docs/sensitive_information_spec.md:
    title: Prevention of Sensitive Information Leakage in Repositories
    purpose: Defines sensitive information that must not be committed to a repository, detection criteria for its inclusion, and the classification, allowlist, and denylist rules used by secret-linter
    content_details:
      - Prohibited secret categories include API tokens, private key blocks, real passwords, connection strings with embedded credentials, and live JWT, session cookie, or signed URL values (section 2.1)
      - Non-secret but risky items such as internal hostnames, private IP addresses, personal names and email addresses, customer identifiers, real app package names, and production resource names (section 2.2)
      - Permitted notations include environment variable or secret store references, explicit placeholders, public keys and endpoints, and documentation reserved example values (section 3)
      - Example values must not be modified copies of real issued values; use officially reserved examples such as AKIAIOSFODNN7EXAMPLE or zero-filled strings (section 4)
      - Detection combines pattern-based matching, AI reading by the secret-reader agent, and deterministic classification in one place, so AI output is only candidates (section 5.1)
      - The secrets-scan ignore marker on a line requires its count and location to be reported, and misuse of the marker is itself a finding (section 5.2)
      - Detected values are shown only to the user and never returned to callers, logs, files, or Agent final responses (section 5.3)
      - Severity catalog runs from critical for valid credentials, private keys, credential connection strings, and undisclosed revoked credentials down to minor for ambiguous placeholders (section 6)
      - "Classification order: denylist match rejects, package_name exemptions, rejected kinds reject, reserved values pass, exact email allowlist match passes, and remaining kinds need confirmation (section 7.1)"
      - Reserved document values from RFC 2606, 6761, 5737, and 3849 such as example.com, 192.0.2.0/24, and com.example packages are treated as pass (section 7.3)
    applicable_tasks:
