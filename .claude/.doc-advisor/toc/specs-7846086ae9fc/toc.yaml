  docs/specs/secret-linter/requirements/REQ-032_secret-linter.md:
    title: REQ-032 secret-linter Requirements Specification
    purpose: Defines requirements for secret-linter, which checks content just before it leaves to Git or GitHub, covering target scopes, pattern and AI detection, sensitive judgment, two lists, and result reporting
    content_details:
      - Target scope options --diff --branch --files --dirs with their exact coverage and the rule that files are checked whole
      - "--branch inspects pushed history (lines and commit messages added by unpushed commits) rather than the working tree, and does not use a base-branch diff"
      - Pattern-based detection always runs deterministically; --rules-only skips AI-based detection and the switch is by option, not by invoking agent
      - Pattern rules for legal-entity company names, passwords written in prose, rephrased domains or IPs, and reverse-domain package names with allowlisted prefixes
      - AI-based detection runs as a subagent over every target mode, only generates candidates, and retries once when its output format is violated
      - Sensitive judgment sorts candidates into fail, confirm, or pass; any fail makes the whole result fail; no automatic fixing
      - "Two lists: allowlist (bundled plus .secret-linter/allowlist.yaml) and sensitive name list (~/.project-secret.yaml), with the sensitive name list taking priority on conflict"
      - Email addresses pass only on exact allowlist match; domain or wildcard entries never pass email addresses
      - "Result output with pass or fail and per-candidate location, kind, value, and verdict; final line is one of three status strings without values; suppression marker secrets-scan: ignore is added only after user consent"
      - "Error cases that all end as not executed: invalid target, git failure, malformed list, user abort at confirmation, and AI output violating format twice"
