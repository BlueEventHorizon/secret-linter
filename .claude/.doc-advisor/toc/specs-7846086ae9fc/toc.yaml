  docs/specs/secret-linter/design/DES-087_secret_linter_design.md:
    title: DES-087 secret-linter Sensitive Information Inspection Design
    purpose: Defines the design of secret-linter, which checks content before it leaves the project, splitting flow control, pattern detection, judgment and AI detection across SKILL, scripts and agent.
    content_details:
      - "Responsibility split: SKILL secret-linter orchestrates the flow, deterministic steps run as Python scripts, and the custom Agent linter:secret-reader handles AI-only detection of unstructured leaks"
      - "Script contract: scan.py, ai_units.py, ai_add.py, ai_finish.py, ai_check.py, judge.py, answer.py, report.py and cleanup.py with exit codes 0 completed, 1 not completed, 2 invalid arguments, and no code 3 or above"
      - "Final line contract: the SKILL returns exactly one final line among secret-linter: pass, secret-linter: fail, or secret-linter: inspection could not be run with reason, never containing values"
      - "Pattern detection order: secrets-scan ignore marker lines, known token formats, private keys, connection strings, JWT, secret-like key assignments, prose passwords, high entropy strings of 40 or more characters with provisional threshold 4.5, then company, obfuscated host, package name, domain, email, private IP and internal host hints"
      - "Judgment order: sensitive name list match is fail, reserved and allowlisted values pass, email passes only on exact allowlist match otherwise confirm, and any single fail makes the whole result fail"
      - "AI candidate contract: ai_add.py accepts a value only if it appears verbatim in the unit text, two consecutive rejections prevent the ai_done.json seal, and AI output carries position, kind and value without a verdict"
      - "Allowlist and name list files: string-only block list format with line-number errors that never echo values, bundled allowlists split into full domain, host-only domain and package prefix files, and user-level project-secret.yaml created on the first secret answer"
      - "Work area: per-run directory created with mode 0700 outside the project under the OS temp directory, removed by cleanup.py on every completed path except interrupted runs"
      - "Scope resolution: diff, dirs, files and branch scope options, where branch reads git log -p -U0 added lines and commit messages of commits not on remotes, and unreadable items are recorded with a reason"
